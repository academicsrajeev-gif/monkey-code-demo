<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonkeyCode AI | Coding Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0d0d0d; color: white; font-family: 'Inter', sans-serif; }
        .sidebar { background-color: #000000; border-right: 1px solid #222; }
        .chat-input { background-color: #1a1a1a; border: 1px solid #333; }
        .message-ai { background-color: transparent; }
        .message-user { background-color: #1a1a1a; border-radius: 12px; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 sidebar flex flex-col p-4 hidden md:flex">
        <div class="flex items-center gap-2 px-2 mb-8">
            <div class="bg-blue-600 p-1.5 rounded-lg text-white">
                <i class="fas fa-monkey text-xl"></i>
            </div>
            <h1 class="text-xl font-bold tracking-tight">MonkeyCode</h1>
        </div>
        
        <button onclick="window.location.reload()" class="flex items-center gap-3 border border-gray-700 hover:bg-gray-900 transition p-3 rounded-xl text-sm mb-6">
            <i class="fas fa-plus"></i> New Chat
        </button>

        <div class="flex-1 overflow-y-auto space-y-2">
            <p class="text-xs text-gray-500 font-bold px-2 uppercase tracking-widest">Recent Chats</p>
            <div class="p-2 text-sm text-gray-400 hover:bg-gray-900 rounded-lg cursor-pointer">Project Setup</div>
            <div class="p-2 text-sm text-gray-400 hover:bg-gray-900 rounded-lg cursor-pointer">Database Schema</div>
        </div>

        <div class="mt-auto border-t border-gray-800 pt-4">
            <button onclick="openModal()" class="w-full text-left p-2 text-sm text-gray-400 hover:text-white transition flex items-center gap-2">
                <i class="fas fa-key"></i> Connect API Key
            </button>
        </div>
    </aside>

    <!-- Main Chat -->
    <main class="flex-1 flex flex-col h-full relative">
        <header class="h-14 border-b border-gray-800 flex items-center px-6 justify-between">
            <span class="text-xs font-medium text-gray-500 uppercase tracking-widest">MonkeyCode AI v1.0</span>
            <div class="flex gap-4">
                <i class="fas fa-gear text-gray-500 hover:text-white cursor-pointer"></i>
            </div>
        </header>

        <div id="chat-container" class="flex-1 overflow-y-auto p-6 md:p-12 space-y-8">
            <div class="max-w-3xl mx-auto message-ai p-4 flex gap-4">
                <div class="w-8 h-8 rounded bg-blue-600 flex items-center justify-center flex-shrink-0">M</div>
                <div>
                    <p class="font-bold text-sm mb-1 text-blue-500">MonkeyCode</p>
                    <p class="text-gray-200">Hello! I'm MonkeyCode. I'm connected to your school project. How can I help you code today?</p>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-6">
            <div class="max-w-3xl mx-auto relative">
                <input id="user-input" type="text" placeholder="Ask anything..." class="w-full chat-input rounded-2xl py-4 px-6 pr-14 focus:outline-none focus:border-blue-500 transition shadow-2xl">
                <button onclick="handleSend()" class="absolute right-4 top-1/2 -translate-y-1/2 text-blue-500 hover:text-blue-400 p-2">
                    <i class="fas fa-paper-plane text-xl"></i>
                </button>
            </div>
            <p class="text-[10px] text-gray-600 text-center mt-3 uppercase tracking-widest">Powered by Supabase & MonkeyCode</p>
        </div>
    </main>

    <!-- Modal -->
    <div id="modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 backdrop-blur-sm">
        <div class="bg-[#111] border border-gray-800 p-8 rounded-3xl w-full max-w-md shadow-2xl">
            <h2 class="text-xl font-bold mb-2">Connect your API Key</h2>
            <p class="text-gray-400 text-sm mb-6">Enter your API key to enable real-time responses.</p>
            <input type="text" placeholder="sk-..." class="w-full bg-black border border-gray-700 p-4 rounded-xl text-sm mb-6 outline-none focus:border-blue-600">
            <div class="flex gap-4">
                <button onclick="closeModal()" class="flex-1 text-gray-400 hover:text-white font-medium">Cancel</button>
                <button onclick="closeModal()" class="flex-1 bg-blue-600 hover:bg-blue-700 py-3 rounded-xl font-bold">Connect</button>
            </div>
        </div>
    </div>

    <script>
        const chat = document.getElementById('chat-container');
        const input = document.getElementById('user-input');

        function handleSend() {
            if(!input.value) return;
            appendMessage('user', input.value);
            const userTxt = input.value;
            input.value = '';
            
            setTimeout(() => {
                appendMessage('assistant', "Thinking...");
                setTimeout(() => {
                    const lastMsg = chat.lastElementChild.querySelector('p:last-child');
                    lastMsg.innerText = "This is a simulated response for your school project! We can connect this to your Supabase Edge Function to make it real.";
                }, 1000);
            }, 500);
        }

        function appendMessage(role, text) {
            const div = document.createElement('div');
            div.className = `max-w-3xl mx-auto p-4 flex gap-4 ${role === 'user' ? 'message-user' : 'message-ai'}`;
            div.innerHTML = `
                <div class="w-8 h-8 rounded ${role === 'user' ? 'bg-gray-700' : 'bg-blue-600'} flex items-center justify-center flex-shrink-0">${role === 'user' ? 'U' : 'M'}</div>
                <div>
                    <p class="font-bold text-sm mb-1 ${role === 'user' ? 'text-gray-400' : 'text-blue-500'}">${role === 'user' ? 'You' : 'MonkeyCode'}</p>
                    <p class="text-gray-200">${text}</p>
                </div>
            `;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function openModal() { document.getElementById('modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        input.addEventListener("keypress", (e) => { if (e.key === "Enter") handleSend(); });
    </script>
</body>
</html>
