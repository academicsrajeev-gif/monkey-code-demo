                                <h2 className="text-3xl font-bold">Professional Experience</h2>
                                <span className={`px-3 py-1 rounded-full text-sm font-medium ${darkMode ? 'bg-blue-900/30 text-blue-400 border border-blue-800' : 'bg-blue-100 text-blue-700 border border-blue-200'}`}>
                                    {profileData.yearsExperience} years
                                </span>
                            </div>
                            
                            <div className="space-y-6">
                                {filteredExperience.map((job, idx) => (
                                    <div
                                        key={job.id}
                                        className={`rounded-xl border overflow-hidden transition-all hover:scale-[1.01] ${darkMode ? 'bg-gradient-to-br from-gray-900/80 to-gray-800/80 border-gray-800 hover:border-gray-700' : 'bg-gradient-to-br from-white to-gray-50 border-gray-200 hover:border-gray-300'} shadow-lg`}
                                    >
                                        <div className="p-6">
                                            <div className="flex flex-col sm:flex-row items-start justify-between gap-4 mb-6">
                                                <div className="flex items-start gap-4 flex-1">
                                                    {/* Dual Logo Display */}
                                                    <div className="flex gap-2">
                                                        <div className="relative">
                                                            <CompanyLogo domain={job.companyDomain} name={job.company} />
                                                            <div className={`absolute -bottom-1 -right-1 px-2 py-0.5 rounded text-xs font-bold ${darkMode ? 'bg-gray-800 text-blue-400' : 'bg-white text-blue-600'} border ${darkMode ? 'border-gray-700' : 'border-gray-200'} shadow`}>
                                                                Employer
                                                            </div>
                                                        </div>
                                                        <div className="relative">
                                                            <CompanyLogo domain={job.clientDomain} name={job.client} />
                                                            <div className={`absolute -bottom-1 -right-1 px-2 py-0.5 rounded text-xs font-bold ${darkMode ? 'bg-gray-800 text-purple-400' : 'bg-white text-purple-600'} border ${darkMode ? 'border-gray-700' : 'border-gray-200'} shadow`}>
                                                                Client
                                                            </div>
                                                        </div>
                                                    </div>
                                                    
                                                    <div className="flex-1">
                                                        <h3 className="text-xl font-bold mb-1 bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">{job.role}</h3>
                                                        <div className={`text-lg mb-2 font-medium ${darkMode ? 'text-gray-300' : 'text-gray-700'}`}>
                                                            <span className="flex items-center gap-2 flex-wrap">
                                                                <Icon name="building-2" className="w-4 h-4 text-blue-500" />
                                                                {job.company}
                                                                <span className={`px-2 py-0.5 rounded text-sm ${darkMode ? 'bg-purple-900/30 text-purple-400' : 'bg-purple-100 text-purple-700'}`}>
                                                                    Client: {job.client}
                                                                </span>
                                                            </span>
                                                        </div>
                                                        <div className={`flex flex-wrap items-center gap-4 text-sm ${darkMode ? 'text-gray-400' : 'text-gray-600'}`}>
                                                            <span className="flex items-center gap-1">
                                                                <Icon name="calendar" className="w-4 h-4" />
                                                                {job.duration}
                                                            </span>
                                                            <span className="flex items-center gap-1">
                                                                <Icon name="map-pin" className="w-4 h-4" />
                                                                {job.location}
                                                            </span>
                                                        </div>
                                                    </div>
                                                </div>
                                                
                                                <button
                                                    onClick={() => toggleJobExpansion(job.id)}
                                                    className={`p-2 rounded-lg transition-all hover:scale-110 ${darkMode ? 'bg-gray-800 hover:bg-gray-700' : 'bg-gray-100 hover:bg-gray-200'}`}
                                                >
                                                    <Icon name={expandedJobs[job.id] ? "chevron-up" : "chevron-down"} className="w-5 h-5" />
                                                </button>
                                            </div>

                                            {/* Tech Stack Chips */}
                                            <div className="flex flex-wrap gap-2 mb-6">
                                                {job.techStack.map((tech, techIdx) => (
                                                    <span
                                                        key={techIdx}
                                                        className={`px-3 py-1.5 rounded-full text-sm font-medium flex items-center gap-2 transition-all hover:scale-105 ${darkMode ? 'bg-gray-800 text-gray-300 border border-gray-700' : 'bg-gray-100 text-gray-700 border border-gray-200'} shadow`}
                                                    >
                                                        <TechIcon tech={tech} size="w-4 h-4" />
                                                        {tech}
                                                    </span>
                                                ))}
                                            </div>

                                            {/* Expandable Achievements */}
                                            {expandedJobs[job.id] && (
                                                <div className="space-y-3 mb-6">
                                                    {job.achievements.map((achievement, achIdx) => (
                                                        <div key={achIdx} className="flex items-start gap-3">
                                                            <Icon name="check-circle" className="w-5 h-5 text-green-500 mt-0.5 flex-shrink-0" />
                                                            <p className={`${darkMode ? 'text-gray-300' : 'text-gray-700'} leading-relaxed`}>{achievement}</p>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}

                                            {/* Key Metrics */}
                                            {Object.keys(job.metrics).length > 0 && (
                                                <div className={`pt-6 border-t grid grid-cols-2 sm:grid-cols-4 gap-4 ${darkMode ? 'border-gray-800' : 'border-gray-200'}`}>
                                                    {Object.entries(job.metrics).map(([key, value]) => (
                                                        <div key={key} className={`text-center p-3 rounded-lg ${darkMode ? 'bg-gray-800/50' : 'bg-gray-50'}`}>
                                                            <div className="text-2xl font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">{value}</div>
                                                            <div className={`text-xs mt-1 ${darkMode ? 'text-gray-500' : 'text-gray-600'}`}>
                                                                {key}
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </div>

                            {filteredExperience.length === 0 && (
                                <div className={`text-center py-12 rounded-xl border ${darkMode ? 'bg-gray-900/30 border-gray-800' : 'bg-gray-50 border-gray-200'}`}>
                                    <Icon name="search" className={`w-16 h-16 mx-auto mb-4 ${darkMode ? 'text-gray-700' : 'text-gray-400'}`} />
                                    <p className={`text-lg ${darkMode ? 'text-gray-400' : 'text-gray-600'}`}>
                                        No matching experience found. Try adjusting your search or filters.
                                    </p>
                                </div>
                            )}
                        </section>

                        {/* Technical Skills */}
                        <section className="mb-16">
                            <div className="flex items-center gap-3 mb-8">
                                <Icon name="code" className="w-8 h-8 text-purple-500" />
                                <h2 className="text-3xl font-bold">Technical Skills</h2>
                            </div>
                            
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {Object.entries(skills).map(([category, techs]) => (
                                    <div
                                        key={category}
                                        className={`rounded-xl p-6 border hover:scale-[1.02] transition-transform ${darkMode ? 'bg-gradient-to-br from-gray-900/80 to-gray-800/80 border-gray-800' : 'bg-gradient-to-br from-white to-gray-50 border-gray-200'} shadow-lg`}
                                    >
                                        <h3 className="text-lg font-bold mb-4 bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">{category}</h3>
                                        <div className="flex flex-wrap gap-2">
                                            {techs.map((tech, idx) => (
                                                <span
                                                    key={idx}
                                                    className={`px-3 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition-all hover:scale-105 ${darkMode ? 'bg-gray-800 hover:bg-gray-700 border border-gray-700' : 'bg-gray-100 hover:bg-gray-200 border border-gray-200'}`}
                                                >
                                                    <TechIcon tech={tech.name} size="w-5 h-5" />
                                                    {tech.name}
                                                </span>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </section>

                        {/* Certifications */}
                        <section className="mb-16">
                            <div className="flex items-center gap-3 mb-8">
                                <Icon name="award" className="w-8 h-8 text-yellow-500" />
                                <h2 className="text-3xl font-bold">Certifications</h2>
                                <span className={`px-3 py-1 rounded-full text-sm font-medium ${darkMode ? 'bg-yellow-900/30 text-yellow-400 border border-yellow-800' : 'bg-yellow-100 text-yellow-700 border border-yellow-200'}`}>
                                    {certifications.length} credentials
                                </span>
                            </div>
                            
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {certifications.map((cert, idx) => (
                                    <div
                                        key={idx}
                                        className={`rounded-xl p-6 border flex items-start gap-4 transition-all hover:scale-[1.02] ${darkMode ? 'bg-gradient-to-br from-gray-900/80 to-gray-800/80 border-gray-800 hover:border-gray-700' : 'bg-gradient-to-br from-white to-gray-50 border-gray-200 hover:border-gray-300'} shadow-lg`}
                                    >
                                        <TechIcon tech={cert.icon} size="w-12 h-12" />
                                        <div className="flex-1">
                                            <h3 className="font-bold mb-1">{cert.name}</h3>
                                            <p className={`text-sm ${darkMode ? 'text-gray-400' : 'text-gray-600'}`}>{cert.issuer}</p>
                                        </div>
                                        <Icon name="check-circle" className="w-6 h-6 text-green-500" />
                                    </div>
                                ))}
                            </div>
                        </section>

                        {/* Education */}
                        <section className="mb-16">
                            <div className="flex items-center gap-3 mb-8">
                                <Icon name="graduation-cap" className="w-8 h-8 text-green-500" />
                                <h2 className="text-3xl font-bold">Education</h2>
                            </div>
                            
                            <div className={`rounded-xl p-8 border ${darkMode ? 'bg-gradient-to-br from-gray-900/80 to-gray-800/80 border-gray-800' : 'bg-gradient-to-br from-white to-gray-50 border-gray-200'} shadow-lg`}>
                                <div className="flex items-start gap-6">
                                    <CompanyLogo domain={education.domain} name="RGPV" size="w-20 h-20" />
                                    <div className="flex-1">
                                        <h3 className="text-2xl font-bold mb-2 bg-gradient-to-r from-green-400 to-teal-500 bg-clip-text text-transparent">{education.institution}</h3>
                                        <p className={`text-lg mb-3 ${darkMode ? 'text-gray-300' : 'text-gray-700'}`}>{education.degree}</p>
                                        <div className="flex flex-wrap gap-4">
                                            <span className={`flex items-center gap-2 px-3 py-1 rounded-lg ${darkMode ? 'bg-gray-800 text-gray-400' : 'bg-gray-100 text-gray-600'}`}>
                                                <Icon name="award" className="w-5 h-5 text-green-500" />
                                                CGPA: {education.cgpa}
                                            </span>
                                            <span className={`flex items-center gap-2 px-3 py-1 rounded-lg ${darkMode ? 'bg-gray-800 text-gray-400' : 'bg-gray-100 text-gray-600'}`}>
                                                <Icon name="map-pin" className="w-5 h-5 text-green-500" />
                                                {education.location}
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </section>

                    </main>

                    {/* Recruiter Modal */}
                    {showRecruiterModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md" onClick={() => setShowRecruiterModal(false)}>
                            <div
                                className={`max-w-2xl w-full rounded-2xl p-8 border ${darkMode ? 'bg-gradient-to-br from-gray-900 to-gray-800 border-gray-800' : 'bg-gradient-to-br from-white to-gray-50 border-gray-200'} shadow-2xl`}
                                onClick={(e) => e.stopPropagation()}
                            >
                                <div className="flex items-center justify-between mb-6">
                                    <h2 className="text-2xl font-bold flex items-center gap-2">
                                        <Icon name="zap" className="w-7 h-7 text-yellow-500" />
                                        <span className="bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">
                                            Recruiter 1-Minute Highlight
                                        </span>
                                    </h2>
                                    <button
                                        onClick={() => setShowRecruiterModal(false)}
                                        className={`p-2 rounded-lg transition-all hover:scale-110 ${darkMode ? 'hover:bg-gray-800' : 'hover:bg-gray-100'}`}
                                    >
                                        <Icon name="x" className="w-6 h-6" />
                                    </button>
                                </div>
                                
                                <div className="space-y-4">
                                    <div className={`p-4 rounded-lg border ${darkMode ? 'bg-blue-900/20 border-blue-800' : 'bg-blue-50 border-blue-200'}`}>
                                        <h3 className="font-bold text-blue-400 mb-2 flex items-center gap-2">
                                            <Icon name="briefcase" className="w-5 h-5" />
                                            🎯 Perfect For
                                        </h3>
                                        <p className={darkMode ? 'text-gray-300' : 'text-gray-700'}>Senior Data Engineer roles in Insurance, FinTech, or Cloud Data Platform teams</p>
                                    </div>
                                    
                                    <div className={`p-4 rounded-lg border ${darkMode ? 'bg-green-900/20 border-green-800' : 'bg-green-50 border-green-200'}`}>
                                        <h3 className="font-bold text-green-400 mb-2 flex items-center gap-2">
                                            <Icon name="trending-up" className="w-5 h-5" />
                                            ⚡ Top Impact
                                        </h3>
                                        <ul className={`space-y-2 text-sm ${darkMode ? 'text-gray-300' : 'text-gray-700'}`}>
                                            <li className="flex items-start gap-2">
                                                <Icon name="check-circle" className="w-4 h-4 text-green-500 mt-0.5 flex-shrink-0" />
                                                Cut pipeline runtime by 83% (3 hours → 20 minutes)
                                            </li>
                                            <li className="flex items-start gap-2">
                                                <Icon name="check-circle" className="w-4 h-4 text-green-500 mt-0.5 flex-shrink-0" />
                                                Migrated 50+ Informatica mappings to Databricks
                                            </li>
                                            <li className="flex items-start gap-2">
                                                <Icon name="check-circle" className="w-4 h-4 text-green-500 mt-0.5 flex-shrink-0" />
                                                Processes 1M+ records daily with 99% reliability
                                            </li>
                                            <li className="flex items-start gap-2">
                                                <Icon name="check-circle" className="w-4 h-4 text-green-500 mt-0.5 flex-shrink-0" />
                                                Reduced cloud costs by 35% through SQL optimization
                                            </li>
                                        </ul>
                                    </div>
                                    
                                    <div className={`p-4 rounded-lg border ${darkMode ? 'bg-purple-900/20 border-purple-800' : 'bg-purple-50 border-purple-200'}`}>
                                        <h3 className="font-bold text-purple-400 mb-2 flex items-center gap-2">
                                            <Icon name="code" className="w-5 h-5" />
                                            🛠 Core Stack
                                        </h3>
                                        <div className="flex flex-wrap gap-2 mt-3">
                                            {['PySpark', 'Databricks', 'Azure Data Factory', 'S3', 'Python', 'SQL'].map(tech => (
                                                <span key={tech} className={`px-3 py-1 rounded-full text-sm font-medium flex items-center gap-2 ${darkMode ? 'bg-gray-800 text-gray-300' : 'bg-gray-100 text-gray-700'}`}>
                                                    <TechIcon tech={tech} size="w-4 h-4" />
                                                    {tech}
                                                </span>
                                            ))}
                                        </div>
                                    </div>
                                    
                                    <div className={`p-4 rounded-lg border ${darkMode ? 'bg-orange-900/20 border-orange-800' : 'bg-orange-50 border-orange-200'}`}>
                                        <h3 className="font-bold text-orange-400 mb-2 flex items-center gap-2">
                                            <Icon name="building-2" className="w-5 h-5" />
                                            🏢 Enterprise Clients
                                        </h3>
                                        <div className="flex flex-wrap gap-4 mt-3">
                                            {[
                                                { name: 'CHUBB', domain: 'chubb.com' },
                                                { name: 'Nationwide', domain: 'nationwide.com' },
                                                { name: 'Marsh McLennan', domain: 'marshmclennan.com' },
                                                { name: 'Microsoft', domain: 'microsoft.com' }
                                            ].map(client => (
                                                <div key={client.name} className="flex items-center gap-2">
                                                    <CompanyLogo domain={client.domain} name={client.name} size="w-8 h-8" />
                                                    <span className={`text-sm font-medium ${darkMode ? 'text-gray-300' : 'text-gray-700'}`}>{client.name}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                                
                                <div className="mt-6 flex gap-3">
                                    <button
                                        onClick={copyEmail}
                                        className="flex-1 py-3 bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 rounded-lg font-medium transition-all flex items-center justify-center gap-2 hover:scale-105"
                                    >
                                        <Icon name="mail" className="w-5 h-5" />
                                        {copiedEmail ? 'Email Copied!' : 'Copy Email'}
                                    </button>
                                    <a
                                        href={`https://${profileData.linkedin}`}
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        className="flex-1 py-3 bg-gradient-to-r from-blue-700 to-purple-700 hover:from-blue-800 hover:to-purple-800 rounded-lg font-medium transition-all flex items-center justify-center gap-2 hover:scale-105"
                                    >
                                        <Icon name="linkedin" className="w-5 h-5" />
                                        Connect on LinkedIn
                                    </a>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Footer */}
                    <footer className={`border-t py-8 ${darkMode ? 'bg-gray-900/50 border-gray-800' : 'bg-white border-gray-200'}`}>
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
                            <p className={darkMode ? 'text-gray-400' : 'text-gray-600'}>
                                © 2025 {profileData.name}. Built with React + Tailwind CSS
                            </p>
                            <p className={`mt-2 text-sm ${darkMode ? 'text-gray-500' : 'text-gray-500'}`}>
                                Available for Senior Data Engineer roles • Open to remote & hybrid opportunities
                            </p>
                        </div>
                    </footer>
                </div>
            );
        };

        ReactDOM.render(<RajeevRanjanPortfolio />, document.getElementById('root'));
    </script>
</body>
</html>
